server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3316/lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: app
    password: apppw
    hikari:
      maximum-pool-size: 5          # 커넥션 5개로 제한
      connection-timeout: 500       # 커넥션 대기 타임아웃 0.5초

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: 127.0.0.1
    port: 5682
    username: app
    password: apppw
    listener:
      simple:
        concurrency: 5        # Consumer 스레드 5개 (DB 커넥션 풀과 동일)
        max-concurrency: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
